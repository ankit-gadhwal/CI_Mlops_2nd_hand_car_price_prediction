apiVersion: apps/v1
kind: Deployment
metadata:
  # name of the deployment
  name: ml-api-deployment
  labels:
    app: ml-api-predictor

spec:
  replicas: 3

  selector:
    matchLabels:
      app: ml-api-predictor

  template:
    metadata:
      labels:
        app: ml-api-predictor

    spec:
      containers:
      - name: ml-api-container
        image: gadhwal41/car-price-predictor:latest

        ports:
        - containerPort: 8000

        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
#  name of the service
  name: ml-api-service
spec:
  # Selects all pods with the label 'app: ml-api-predictor'
  selector:
    app: ml-api-predictor
  ports:
    - protocol: TCP
      port: 80 # The port the service exposes (users hit this port)
      targetPort: 8000 # The port the container is listening on
    # Type: NodePort exposes the service outside the cluster,making it easy to access.
  type: LoadBalancer
